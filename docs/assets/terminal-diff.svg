<!-- Captured from Toffee 1.0.0 with temporary dev/prod files; values are disposable examples and no output wording was changed. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Toffee environment diff output</title>
  <desc id="desc">Variables and backend differences between disposable dev and prod configurations</desc>
  <rect width="1200" height="560" rx="22" fill="#17130f"/>
  <path d="M22 0h1156a22 22 0 0 1 22 22v54H0V22A22 22 0 0 1 22 0Z" fill="#2c241e"/>
  <circle cx="38" cy="38" r="10" fill="#f26d5b"/>
  <circle cx="70" cy="38" r="10" fill="#eab14d"/>
  <circle cx="102" cy="38" r="10" fill="#62bd68"/>
  <text x="600" y="46" text-anchor="middle" fill="#d8cfc6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">toffee - configuration diff</text>
  <text x="42" y="112" fill="#f7eadb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">
    <tspan x="42" dy="0" fill="#f1ad55">$ toffee diff dev prod</tspan>
    <tspan x="42" dy="48" font-weight="700">Variables differences</tspan>
    <tspan x="42" dy="34" fill="#f1ad55">environment</tspan>
    <tspan x="74" dy="32"><tspan fill="#79d18a">dev:</tspan> "dev"</tspan>
    <tspan x="74" dy="32"><tspan fill="#ffd166">prod:</tspan> "prod"</tspan>
    <tspan x="42" dy="38" fill="#f1ad55">region</tspan>
    <tspan x="74" dy="32"><tspan fill="#79d18a">dev:</tspan> "us-west-2"</tspan>
    <tspan x="74" dy="32"><tspan fill="#ffd166">prod:</tspan> "us-east-1"</tspan>
    <tspan x="650" y="160" font-weight="700">Backend differences</tspan>
    <tspan x="650" dy="38" fill="#f1ad55">key</tspan>
    <tspan x="682" dy="34"><tspan fill="#79d18a">dev:</tspan> "service/dev/terraform.tfstate"</tspan>
    <tspan x="682" dy="34"><tspan fill="#ffd166">prod:</tspan> "prod/terraform.tfstate"</tspan>
  </text>
</svg>
