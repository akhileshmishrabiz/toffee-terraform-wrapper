<!-- Captured from Toffee 1.0.0 in a temporary project. The backend was replaced with the documented example value; no real credentials or paths were used. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Protected production apply prompt</title>
  <desc id="desc">Toffee shows the production target and example backend, then aborts after a negative answer</desc>
  <rect width="1200" height="460" rx="22" fill="#17130f"/>
  <path d="M22 0h1156a22 22 0 0 1 22 22v54H0V22A22 22 0 0 1 22 0Z" fill="#2c241e"/>
  <circle cx="38" cy="38" r="10" fill="#f26d5b"/>
  <circle cx="70" cy="38" r="10" fill="#eab14d"/>
  <circle cx="102" cy="38" r="10" fill="#62bd68"/>
  <text x="600" y="46" text-anchor="middle" fill="#d8cfc6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">toffee - protected environment</text>
  <text x="42" y="118" fill="#f7eadb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23">
    <tspan x="42" dy="0" fill="#f1ad55">$ toffee prod apply -auto-approve</tspan>
    <tspan x="42" dy="58" fill="#ffd166">&#x26A0; You are about to apply changes to PROD.</tspan>
    <tspan x="42" dy="58">Environment: prod</tspan>
    <tspan x="42" dy="42">Backend: s3://company-tf-state/prod/terraform.tfstate</tspan>
    <tspan x="42" dy="58">Continue? [y/N]: </tspan><tspan fill="#f26d5b">n</tspan>
    <tspan x="42" dy="42" fill="#f26d5b">Operation aborted.</tspan>
  </text>
</svg>
