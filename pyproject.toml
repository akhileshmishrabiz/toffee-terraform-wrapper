[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "toffee"
dynamic = ["version"]
description = "A lightweight environment-first Terraform wrapper"
authors = [
    {name = "Akhilesh Mishra", email = "akhileshmishrabiz@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.2",
    "rich>=12.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
toffee = "toffee.cli:app"

[tool.setuptools.dynamic]
version = {attr = "toffee.__version__"}

[tool.setuptools.packages.find]
include = ["toffee*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
